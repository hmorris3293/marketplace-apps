---
- name: Install newrelic if enabled
  include_tasks: newrelic.yml
  when: "'newrelic' in add_ons"

- name: Install node_exporter if enabled
  include_tasks: node-exporter.yml
  when: "'node_exporter' in add_ons"

- name: Install mysqld_exporter if enabled
  include_tasks: mysqld-exporter.yml
  when: "'mysqld_exporter' in add_ons"

