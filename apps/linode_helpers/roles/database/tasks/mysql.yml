---

- name: Install MySQL
  apt:
    pkg:
      - mysql-server
      - python3-mysqldb
    state: present
    update_cache: yes

- name: Ensure MySQL service is started
  service:
    name: mysql
    state: started
    enabled: yes

- name: Reset root password 
  community.mysql.mysql_user:
    name: root
    host: localhost
    password: "{{ mysql_root_password }}"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Allow root login via Unix socket (no password required)
  community.mysql.mysql_user:
    name: root
    host: localhost
    plugin: auth_socket
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Remove all anonymous users
  community.mysql.mysql_user:
    name: ''
    host_all: true
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Remove test database
  community.mysql.mysql_db:
    name: test
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock
