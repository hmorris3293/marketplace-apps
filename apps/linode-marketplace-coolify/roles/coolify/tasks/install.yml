---
- name: Create Coolify directories
  file:
    path: "{{ item }}"
    state: directory
    owner: '9999'
    group: root
    mode: '0700'
  loop: "{{ coolify_directories }}"

- name: Download Coolify configuration files
  get_url:
    url: "{{ coolify_cdn_url }}/{{ item.name }}"
    dest: "{{ coolify_source_directory }}/{{ item.name }}"
    mode: "{{ item.mode }}"
  loop:
    - { name: docker-compose.yml, mode: '0644' }
    - { name: docker-compose.prod.yml, mode: '0644' }
    - { name: .env.production, mode: '0644' }
    - { name: upgrade.sh, mode: '0755' }
    - { name: upgrade-postgres.sh, mode: '0755' }

- name: Bind Coolify ports to localhost for nginx
  copy:
    dest: "{{ coolify_source_directory }}/docker-compose.custom.yml"
    mode: '0644'
    content: |
      services:
        coolify:
          ports: !override
            - "127.0.0.1:8000:8080"
            - "127.0.0.1:6001:6001"
            - "127.0.0.1:6002:6002"

- name: Create Coolify env file from template
  copy:
    src: "{{ coolify_source_directory }}/.env.production"
    dest: "{{ coolify_source_directory }}/.env"
    remote_src: true
    force: false
    mode: '0600'

- name: Set Coolify secrets and admin credentials
  lineinfile:
    path: "{{ coolify_source_directory }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: APP_ID, value: "{{ coolify_app_id }}" }
    - { key: APP_KEY, value: "base64:{{ coolify_app_key | b64encode }}" }
    - { key: DB_PASSWORD, value: "{{ coolify_db_password }}" }
    - { key: REDIS_PASSWORD, value: "{{ coolify_redis_password }}" }
    - { key: PUSHER_APP_ID, value: "{{ coolify_pusher_app_id }}" }
    - { key: PUSHER_APP_KEY, value: "{{ coolify_pusher_app_key }}" }
    - { key: PUSHER_APP_SECRET, value: "{{ coolify_pusher_app_secret }}" }
    - { key: ROOT_USERNAME, value: "{{ coolify_admin_username }}" }
    - { key: ROOT_USER_EMAIL, value: "{{ admin_email }}" }
    - { key: ROOT_USER_PASSWORD, value: "{{ coolify_admin_password }}" }
  loop_control:
    label: "{{ item.key }}"
  no_log: true
