---
- name: Create Hermes user
  user:
    name: "{{ hermes_user }}"
    home: "/home/{{ hermes_user }}"
    shell: /bin/bash
    createhome: yes
    state: present

- name: Create Hermes home directory structure
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0755'
  loop:
    - "{{ hermes_home }}"
    - "{{ hermes_home }}/bin"
    - "{{ hermes_home }}/cron"
    - "{{ hermes_home }}/sessions"
    - "{{ hermes_home }}/logs"
    - "{{ hermes_home }}/pairing"
    - "{{ hermes_home }}/hooks"
    - "{{ hermes_home }}/image_cache"
    - "{{ hermes_home }}/audio_cache"
    - "{{ hermes_home }}/memories"
    - "{{ hermes_home }}/skills"

- name: Add Hermes user to sudoers (scoped for gateway only)
  copy:
    dest: "/etc/sudoers.d/{{ hermes_user }}"
    mode: "0440"
    owner: root
    group: root
    content: |
      # Hermes sudo permissions (scoped for security)
      # Allows hermes user to manage only the hermes-gateway service
      
      {{ hermes_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl start hermes-gateway
      {{ hermes_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl stop hermes-gateway
      {{ hermes_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl restart hermes-gateway
      {{ hermes_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl status hermes-gateway
      {{ hermes_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl enable hermes-gateway
      {{ hermes_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl disable hermes-gateway
      {{ hermes_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl daemon-reload
    validate: /usr/sbin/visudo -cf %s

- name: Create install directory
  file:
    path: "{{ hermes_install_dir }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0755'

- name: Install system dependencies
  apt:
    name:
      - build-essential
      - python3-dev
      - libffi-dev
      - curl
      - wget
      - git
      - ca-certificates
      - pkg-config
      - libssl-dev
      - zlib1g-dev
      - ripgrep
      - ffmpeg
    state: present
    update_cache: yes

- name: Create .env file
  file:
    path: "{{ hermes_home }}/.env"
    state: touch
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'

- name: Create config.yaml from template
  copy:
    content: |
      # Hermes Agent Configuration
      # Edit this file to customize your agent's behavior
      
      # Model configuration
      model:
        provider: openai
        name: gpt-4
      
      # Add your API keys to ~/.hermes/.env
    dest: "{{ hermes_home }}/config.yaml"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0644'

- name: Create SOUL.md (persona file)
  copy:
    content: |
      # Hermes Agent Persona
      
      <!--
      This file defines the agent's personality and tone.
      The agent will embody whatever you write here.
      Edit this to customize how Hermes communicates with you.
      
      Examples:
        - "You are a warm, playful assistant who uses kaomoji occasionally."
        - "You are a concise technical expert. No fluff, just facts."
        - "You speak like a friendly coworker who happens to know everything."
      
      This file is loaded fresh each message -- no restart needed.
      Delete the contents (or this file) to use the default personality.
      -->
    dest: "{{ hermes_home }}/SOUL.md"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0644'

- name: Configure UV environment variables
  lineinfile:
    path: "{{ hermes_home }}/.bashrc"
    line: "export UV_NO_CONFIG=1"
    create: yes
    state: present
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
  become_user: "{{ hermes_user }}"



