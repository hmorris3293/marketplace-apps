- name: Install main package with all extras
  shell: |
    {{ hermes_home }}/bin/uv sync --extra all --locked || \
    {{ hermes_home }}/bin/uv pip install -e '.[all]' || \
    {{ hermes_home }}/bin/uv pip install -e '.'
  args:
    chdir: "{{ hermes_install_dir }}"
  environment:
    UV_NO_CONFIG: "1"
    VIRTUAL_ENV: "{{ hermes_install_dir }}/venv"
    UV_PYTHON: "{{ hermes_install_dir }}/venv/bin/python"
  become_user: "{{ hermes_user }}"

- name: Install npm dependencies
  command: npm install --silent
  chdir: "{{ hermes_install_dir }}"
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  become_user: "{{ hermes_user }}"

- name: Create command symlink in /usr/local/bin
  file:
    src: "{{ hermes_install_dir }}/venv/bin/hermes"
    dest: /usr/local/bin/hermes
    state: link
    force: yes

- name: Run skills sync
  command: "{{ hermes_install_dir }}/venv/bin/python tools/skills_sync.py"
  chdir: "{{ hermes_install_dir }}"
  become_user: "{{ hermes_user }}"

- name: Add Hermes home to PATH
  lineinfile:
    path: "{{ hermes_home }}/.bashrc"
    line: "export PATH={{ hermes_home }}/bin:$PATH"
    create: yes
    state: present
  become_user: "{{ hermes_user }}"

- name: Create shell profile configuration
  template:
    src: hermes_env.j2
    dest: "{{ hermes_home }}/.hermes_env"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: "0644"

- name: Add sourcing of hermes_env to bashrc
  lineinfile:
    path: "{{ hermes_home }}/.bashrc"
    line: "[ -f {{ hermes_home }}/.hermes_env ] && source {{ hermes_home }}/.hermes_env"
    create: yes
    state: present
  become_user: "{{ hermes_user }}"

- name: Reload systemd and enable Hermes gateway
  systemd:
    name: hermes-gateway
    daemon_reload: true
    enabled: true

---
- name: Create hermes onboarding script
  template:
    src: hermes_onboarding.sh.j2
    dest: /etc/profile.d/hermes_onboarding.sh
    owner: root
    group: root
    mode: '0755'

