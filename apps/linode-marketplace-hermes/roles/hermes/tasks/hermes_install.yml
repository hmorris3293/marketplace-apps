---
- name: Download uv installer
  get_url:
    url: "https://astral.sh/uv/install.sh"
    dest: "/tmp/uv-installer.sh"
    mode: '0755'

- name: Install uv
  shell: |
    UV_UNMANAGED_INSTALL="{{ hermes_home }}/bin" bash /tmp/uv-installer.sh
  environment:
    UV_NO_CONFIG: "1"
  become_user: "{{ hermes_user }}"

- name: Verify uv installation
  command: "{{ hermes_home }}/bin/uv --version"

- name: Clone repository via HTTPS
  git:
    repo: "{{ repo_url }}"
    dest: "{{ hermes_install_dir }}"
    branch: "{{ branch_name }}"
    depth: 1
    accept_hostkey: yes
  become_user: "{{ hermes_user }}"

- name: Create virtual environment with uv
  shell: |
    {{ hermes_home }}/bin/uv venv {{ hermes_install_dir }}/venv --python {{ python_version }}
  environment:
    UV_NO_CONFIG: "1"
  become_user: "{{ hermes_user }}"

- name: Set UV_PYTHON environment variable
  lineinfile:
    path: "{{ hermes_home }}/.bashrc"
    line: "export UV_PYTHON={{ hermes_install_dir }}/venv/bin/python"
    create: yes
    state: present
  become_user: "{{ hermes_user }}"

