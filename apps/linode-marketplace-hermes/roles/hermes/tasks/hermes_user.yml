---
- name: Create hermes system user
  user:
    name: "{{ hermes_user }}"
    comment: "Hermes Service User"
    shell: /bin/bash
    create_home: true
    home: "{{ hermes_home }}"
    state: present

- name: Add Hermes user to sudoers with scoped NOPASSWD
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ hermes_user }}"
    mode: "0440"
    owner: root
    group: root
    content: |
      # Hermes sudo permissions (scoped for security)
      #
      # SECURITY NOTE: These permissions are intentionally limited.
      # If hermes is compromised, attackers can only:
      # - Manage the hermes-gateway service
      # - View hermes-gateway logs
      #
      # To grant full sudo (NOT RECOMMENDED):
      #   {{ hermes_user }} ALL=(ALL) NOPASSWD: ALL

      # Service control - hermes-gateway service only
      {{ hermes_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl start hermes-gateway
      {{ hermes_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl stop hermes-gateway
      {{ hermes_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl restart hermes-gateway
      {{ hermes_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl status hermes-gateway
      {{ hermes_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl enable hermes-gateway
      {{ hermes_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl disable hermes-gateway

      # daemon-reload required after service file changes
      {{ hermes_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl daemon-reload

      # Journal access - hermes-gateway logs only
      {{ hermes_user }} ALL=(root) NOPASSWD: /usr/bin/journalctl -u hermes-gateway *
    validate: /usr/sbin/visudo -cf %s

- name: Get hermes user ID
  command: "id -u {{ openclaw_user }}"
  register: hermes_uid
  changed_when: false

- name: Enable lingering for hermes user (allows systemd user services without login)
  command: "loginctl enable-linger {{ hermes_user }}"
  changed_when: false

- name: Create runtime directory for hermes user
  file:
    path: "/run/user/{{ openclaw_uid.stdout }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0700'

- name: Set XDG_RUNTIME_DIR in .bashrc for hermes user
  lineinfile:
    path: "{{ openclaw_home }}/.bashrc"
    line: 'export XDG_RUNTIME_DIR=/run/user/$(id -u)'
    state: present
    create: true
    insertafter: EOF
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0644'

- name: Set DBUS_SESSION_BUS_ADDRESS in .bashrc for hermes user
  blockinfile:
    path: "{{ hermes_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - DBus config"
    block: |
      # DBus session bus configuration
      if [ -z "$DBUS_SESSION_BUS_ADDRESS" ]; then
        export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
      fi
    create: true
    insertafter: EOF
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0644'
