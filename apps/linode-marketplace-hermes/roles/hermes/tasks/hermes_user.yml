---
- name: Create Hermes user
  user:
    name: "{{ hermes_user }}"
    home: "/home/{{ hermes_user }}"
    shell: /bin/bash
    createhome: yes
    state: present

- name: Create Hermes home directory structure
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0755'
  loop:
    - "{{ hermes_home }}"
    - "{{ hermes_home }}/bin"
    - "{{ hermes_home }}/cron"
    - "{{ hermes_home }}/sessions"
    - "{{ hermes_home }}/logs"
    - "{{ hermes_home }}/pairing"
    - "{{ hermes_home }}/hooks"
    - "{{ hermes_home }}/image_cache"
    - "{{ hermes_home }}/audio_cache"
    - "{{ hermes_home }}/memories"
    - "{{ hermes_home }}/skills"

