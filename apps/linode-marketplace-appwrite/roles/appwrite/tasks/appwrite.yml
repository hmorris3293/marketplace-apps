---
- name: Debug Appwrite secrets
  ansible.builtin.debug:
    msg:
      appwrite_secret_key: "{{ appwrite_secret_key }}"
      appwrite_opensslkey: "{{ appwrite_opensslkey }}"
      appwrite_installid: "{{ appwrite_installid }}"
      appwrite_csrf: "{{ appwrite_csrf }}"
      appwrite_admin_password: "{{ appwrite_admin_password }}"

- name: Install Appwrite
  uri:
    url: "http://localhost:20080/install"
    method: POST
    headers:
      Accept: "text/event-stream"
      Accept-Language: "en-US,en;q=0.9"
      Connection: "keep-alive"
      Content-Type: "application/json"
      X-Appwrite-Installer-CSRF: "{{ appwrite_csrf }}"
      Cookie: "appwrite-installer-csrf={{ appwrite_csrf }}"
    body_format: json
    body:
      installId: "{{ appwrite_installid }}"
      opensslKey: "{{ appwrite_opensslkey }}"
      httpPort: "80"
      httpsPort: "443"
      database: "mongodb"
      appDomain: "{{ _domain }}"
      emailCertificates: "{{ soa_email_address }}"
      assistantOpenAIKey: ""
      accountEmail: "{{ soa_email_address }}"
      accountPassword: "{{ appwrite_admin_password }}"
      migrate: false
    validate_certs: false
    status_code: [200, 201, 202]
    timeout: 120
  register: appwrite_install_result

- name: Wait for Appwrite containers to be running
  community.docker.docker_container_info:
    name: "{{ item }}"
  register: container_info
  retries: 20
  delay: 15
  until: container_info.container.State.Running == true
  loop:
    - appwrite-traefik
    - appwrite-worker-mails
    - appwrite-worker-deletes
    - appwrite-task-scheduler-messages
    - appwrite-task-scheduler-executions
    - appwrite-task-stats-resources
    - appwrite-worker-audits
    - appwrite-worker-functions
    - appwrite
    - appwrite-worker-messaging
    - appwrite-worker-databases
    - appwrite-worker-certificates
    - appwrite-realtime
    - appwrite-worker-stats-resources
    - appwrite-worker-builds
    - appwrite-task-maintenance
    - appwrite-worker-stats-usage
    - appwrite-task-scheduler-functions
    - appwrite-worker-webhooks
    - appwrite-worker-migrations
    - appwrite-redis
    - openruntimes-executor
    - appwrite-console
    - appwrite-mongodb
    - appwrite-browser

- name: Wait for healthy containers to report healthy
  community.docker.docker_container_info:
    name: "{{ item }}"
  register: healthy_info
  retries: 20
  delay: 15
  until: healthy_info.container.State.Health.Status == "healthy"
  loop:
    - appwrite-redis
    - openruntimes-executor
    - appwrite-mongodb

- name: Stop and remove Appwrite installer container
  community.docker.docker_container:
    name: appwrite-installer
    state: absent
    force_kill: true