---
- name: Enforce operating system guardrail (Ubuntu only)
  assert:
    that:
      - ansible_distribution == 'Ubuntu'
    fail_msg: "This playbook strictly requires Ubuntu."

- name: Install system dependencies
  apt:
    name:
      - curl
      - tar
      - ca-certificates
      - rustc
      - cargo
    state: present

- name: Create OpenFang directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0755'
  loop:
    - "{{ openfang_bin_path }}"
    - "{{ openfang_home }}"
    - "{{ openfang_data_dir }}"
    - "{{ openfang_agents_dir }}"

- name: Create secure temporary directory for download
  tempfile:
    state: directory
    suffix: openfang
  register: openfang_temp
  become: true
  become_user: "{{ username }}"

- name: Download and unpack OpenFang release archive
  unarchive:
    src: "{{ openfang_release_url }}/latest/download/openfang-x86_64-unknown-linux-gnu.tar.gz"
    dest: "{{ openfang_temp.path }}"
    remote_src: true
    owner: "{{ username }}"
    group: "{{ username }}"
  become: true
  become_user: "{{ username }}"

- name: Locate extracted OpenFang binary
  find:
    paths: "{{ openfang_temp.path }}"
    patterns: openfang
    file_type: file
    recurse: true
  register: openfang_binary
  become: true
  become_user: "{{ username }}"

- name: Ensure the OpenFang binary was found
  assert:
    that:
      - openfang_binary.matched > 0
    fail_msg: "Failed to locate the 'openfang' binary inside the downloaded release archive."

- name: Install OpenFang binary
  copy:
    src: "{{ openfang_binary.files[0].path }}"
    dest: "{{ openfang_bin_path }}/openfang"
    remote_src: true
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0755'
  become: true
  become_user: "{{ username }}"
  notify: Restart openfang

- name: Clean up download artifacts
  file:
    path: "{{ openfang_temp.path }}"
    state: absent
  become: true
  become_user: "{{ username }}"

- name: Verify OpenFang binary works
  command: "{{ openfang_bin_path }}/openfang --version"
  register: openfang_version_check
  changed_when: false

- name: Create OpenFang config.toml
  template:
    src: openfang.toml.j2
    dest: "{{ openfang_config_path }}"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0640'
  notify: Restart openfang

- name: Create OpenFang env file
  copy:
    content: ""
    dest: "{{ openfang_env_file }}"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0600'
    force: false

- name: Add OpenFang environment for interactive shells
  template:
    src: openfang_env.sh.j2
    dest: /etc/profile.d/openfang.sh
    mode: '0755'

- name: Create OpenFang systemd service
  template:
    src: openfang.service.j2
    dest: /etc/systemd/system/openfang.service
    mode: '0644'
  notify: Reload systemd daemon

- name: Enable and start OpenFang service
  systemd_service:
    name: openfang
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for OpenFang API to be ready
  wait_for:
    host: 127.0.0.1
    port: "{{ openfang_api_port }}"
    timeout: 120
    delay: 2
