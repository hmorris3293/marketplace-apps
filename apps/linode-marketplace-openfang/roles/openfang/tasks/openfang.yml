---
- name: Install system dependencies
  apt:
    name:
      - curl
      - tar
      - ca-certificates
      - rustc
      - cargo
    state: present
  retries: 3
  delay: 10

- name: Create OpenFang directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0755'
  loop:
    - "{{ openfang_bin_path }}"
    - "{{ openfang_home }}"
    - "{{ openfang_data_dir }}"
    - "{{ openfang_agents_dir }}"

- name: Download OpenFang binary
  get_url:
    url: "{{ openfang_release_url }}/download/v{{ openfang_version }}/openfang-{{ openfang_target_os }}.tar.gz"
    dest: "/tmp/openfang-{{ openfang_version }}.tar.gz"
    mode: '0644'
  retries: 3
  delay: 10

- name: Extract OpenFang binary
  unarchive:
    src: "/tmp/openfang-{{ openfang_version }}.tar.gz"
    dest: "/tmp/"
    remote_src: true

- name: Install OpenFang binary
  copy:
    src: "/tmp/openfang"
    dest: "{{ openfang_bin_path }}/openfang"
    remote_src: true
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0755'
  notify: Restart openfang

- name: Verify OpenFang binary works
  command: "{{ openfang_bin_path }}/openfang --version"
  register: openfang_version_check
  changed_when: false

- name: Display OpenFang version
  debug:
    msg: "OpenFang installed: {{ openfang_version_check.stdout }}"

- name: Create OpenFang config.toml
  template:
    src: openfang.toml.j2
    dest: "{{ openfang_config_path }}"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0640'
  notify: Restart openfang

- name: Create OpenFang env file
  copy:
    content: ""
    dest: "{{ openfang_env_file }}"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0600'
    force: false

- name: Add OpenFang environment for interactive shells
  template:
    src: openfang_env.sh.j2
    dest: /etc/profile.d/openfang.sh
    mode: '0755'

- name: Create OpenFang systemd service
  template:
    src: openfang.service.j2
    dest: /etc/systemd/system/openfang.service
    mode: '0644'
  notify: Reload systemd daemon

- name: Enable and start OpenFang service
  systemd_service:
    name: openfang
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for OpenFang API to be ready
  wait_for:
    host: 127.0.0.1
    port: "{{ openfang_api_port }}"
    timeout: 120
    delay: 2

- name: Cleanup temporary files
  file:
    path: "/tmp/openfang{{ item }}"
    state: absent
  loop:
    - ""
    - "-{{ openfang_version }}.tar.gz"
