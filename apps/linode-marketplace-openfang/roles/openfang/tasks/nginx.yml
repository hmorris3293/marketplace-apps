---
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Create Nginx vhost configuration
  template:
    src: nginx-openfang.conf.j2
    dest: /etc/nginx/sites-available/{{ openfang_domain }}
    mode: '0644'

- name: Enable vhost for {{ openfang_domain }}
  file:
    src: /etc/nginx/sites-available/{{ openfang_domain }}
    dest: /etc/nginx/sites-enabled/{{ openfang_domain }}
    state: link

- name: Disable Nginx default vhost
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Enable and start Nginx
  systemd_service:
    name: nginx
    state: started
    enabled: true

- name: Install SSL certificate
  import_role:
    name: certbot_ssl
  vars:
    webserver_stack: lemp
    default_dns: "{{ openfang_domain }}"
    soa_email_address: "{{ soa_email_address | default('admin@' ~ openfang_domain) }}"
  when:
    - openfang_enable_ssl | bool
    - openfang_domain != 'localhost'
  notify: restart nginx
