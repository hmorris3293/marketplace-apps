---
# set app specific ufw rules
# OpenFang's API port is intentionally NOT opened; it binds to loopback and
# is reached only through the NGINX proxy on 80/443.
- name: Allow all access to tcp port 22
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Allow all access to HTTP
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow all access to HTTPS
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp
