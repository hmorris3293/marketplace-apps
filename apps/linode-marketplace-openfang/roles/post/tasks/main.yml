---
# Install Addons if requested
- name: Add addons
  import_role:
    name: addons
  when: add_ons != ['none']

# motd and creds gen
- name: Copy MOTD template to /etc/motd
  template:
    src: templates/motd.j2
    dest: /etc/motd
    mode: '0600'
    owner: '{{ username }}'
    group: '{{ username }}'

- name: Writing sudo creds into file
  copy:
    dest: '/home/{{ username }}/.credentials'
    mode: '0600'
    owner: '{{ username }}'
    group: '{{ username }}'
    content: |
      Sudo Username: {{ username }}
      Sudo Password: {{ password }}

      OpenFang listens on 127.0.0.1:4200 (loopback only) and is reached over an
      SSH tunnel - no public web port is exposed.

      Dashboard access (run locally):
        ssh -L 4200:127.0.0.1:4200 {{ username }}@{{ _domain }}
      Then browse to: http://127.0.0.1:4200

      OpenFang API Bearer Token: {{ openfang_api_key }}

      # Configure your LLM provider from the OpenFang dashboard, or add a
      # provider key to /home/{{ username }}/.openfang/.env and then run:
      #   systemctl restart openfang
      #   e.g. OPENAI_API_KEY=... (also ANTHROPIC_API_KEY, GROQ_API_KEY)
