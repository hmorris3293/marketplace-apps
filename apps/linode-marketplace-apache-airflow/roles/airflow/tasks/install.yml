- name: Set deployment fact
  set_fact:
    airflow_home: /opt/airflow

- name: Install Docker latest
  import_role:
    name: docker

- name: Install Docker Compose plugin
  apt:
    name: docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure airflow group exists
  group:
    name: airflow
    gid: 50000
    state: present

- name: Ensure airflow user exists
  user:
    name: airflow
    uid: 50000
    group: airflow
    home: /opt/airflow
    shell: /bin/bash
    create_home: yes
    state: present

- name: Create Airflow directories
  file:
    path: "/opt/airflow/{{ item }}"
    state: directory
    owner: airflow
    group: airflow
    mode: '0755'
  loop:
    - dags
    - logs
    - plugins
    - backup
    - config

- name: Ensure /opt/airflow ownership
  file:
    path: /opt/airflow
    state: directory
    recurse: yes
    owner: airflow
    group: airflow

- name: Deploy Docker Compose template for Airflow
  template:
    src: docker-compose.yml.j2
    dest: /opt/airflow/docker-compose.yml
    owner: airflow
    group: airflow
    mode: '0644'

- name: Deploy .env file for Airflow
  template:
    src: env.j2
    dest: /opt/airflow/.env
    owner: airflow
    group: airflow
    mode: '0600'