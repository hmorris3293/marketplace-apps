- name: Ensure /opt/airflow is owned by airflow
  file:
    path: /opt/airflow
    state: directory
    recurse: yes
    owner: airflow
    group: airflow

- name: Run airflow-cli to list config
  command:
    cmd: docker compose run airflow-cli airflow config list
    chdir: /opt/airflow
  become: yes

- name: Run Airflow init container using Docker Compose
  command:
    cmd: docker compose up airflow-init
    chdir: /opt/airflow
  become: yes

- name: Start Airflow stack with Docker Compose
  community.docker.docker_compose_v2:
    project_src: /opt/airflow
    state: present
    recreate: always        
    remove_orphans: true  
    detach: true      
  become: yes
  async: 60      
  poll: 0

- name: Wait for Airflow containers to become healthy
  shell: |
    docker ps --filter "health=healthy" --format '{{.Names}}' | wc -l
  register: healthy_count
  until: healthy_count.stdout|int >= 6
  retries: 30
  delay: 5
  changed_when: false

