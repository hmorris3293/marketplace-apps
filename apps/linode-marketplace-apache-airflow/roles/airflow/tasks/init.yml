---
- name: Create empty airflow.cfg file
  file:
    path: /opt/airflow/config/airflow.cfg
    state: touch
    owner: airflow
    group: airflow
    mode: '0644'

- name: Run airflow-cli to list config
  command:
    cmd: docker compose run airflow-cli airflow config list
    chdir: /opt/airflow
  become: yes

- name: Run Airflow init container using Docker Compose
  command:
    cmd: docker compose up airflow-init
    chdir: /opt/airflow
  become: yes

- name: Start Airflow stack with Docker Compose 
  community.docker.docker_compose_v2:
    project_src: /opt/airflow       
    state: present                  
    recreate: yes                   
    remove_orphans: yes            
  become: yes
