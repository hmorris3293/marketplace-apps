---
- name: Install git
  apt:
    name: git
    state: present

- name: Clone NemoClaw at the latest commit on the default branch
  git:
    repo: "{{ nemoclaw_repo }}"
    dest: "{{ nemoclaw_src_dir }}"
    version: HEAD
    force: false
  become: true
  become_user: "{{ nemoclaw_user }}"

- name: Seed remote dashboard bind build arg in NemoClaw Dockerfiles
  lineinfile:
    path: "{{ item.path }}"
    regexp: '^ARG NEMOCLAW_DASHBOARD_BIND=.*$'
    line: 'ARG NEMOCLAW_DASHBOARD_BIND=0.0.0.0'
    insertafter: "{{ item.insertafter }}"
  loop:
    - path: "{{ nemoclaw_src_dir }}/Dockerfile"
      insertafter: '^ARG CHAT_UI_URL=.*$'
    - path: "{{ nemoclaw_src_dir }}/agents/hermes/Dockerfile"
      insertafter: '^ARG CHAT_UI_URL=.*$'
    - path: "{{ nemoclaw_src_dir }}/agents/langchain-deepagents-code/Dockerfile"
      insertafter: '^ARG NEMOCLAW_BUILD_ID=.*$'

- name: Install NemoClaw npm dependencies (no lifecycle scripts)
  community.general.npm:
    path: "{{ nemoclaw_src_dir }}"
    ci: false
    production: false
    ignore_scripts: true
  environment:
    HOME: "{{ nemoclaw_home }}"
  become: true
  become_user: "{{ nemoclaw_user }}"

- name: Build the NemoClaw CLI
  command: npm run build:cli
  args:
    chdir: "{{ nemoclaw_src_dir }}"
    creates: "{{ nemoclaw_src_dir }}/dist/nemoclaw.js"
  environment:
    HOME: "{{ nemoclaw_home }}"
  become: true
  become_user: "{{ nemoclaw_user }}"

- name: Make the NemoClaw CLI entrypoint executable
  file:
    path: "{{ nemoclaw_src_dir }}/bin/nemoclaw.js"
    mode: '0755'

- name: Symlink the nemoclaw CLI onto PATH
  file:
    src: "{{ nemoclaw_src_dir }}/bin/nemoclaw.js"
    dest: /usr/local/bin/nemoclaw
    state: link

- name: Verify NemoClaw CLI version
  command: /usr/local/bin/nemoclaw --version
  changed_when: false
  become: true
  become_user: "{{ nemoclaw_user }}"
