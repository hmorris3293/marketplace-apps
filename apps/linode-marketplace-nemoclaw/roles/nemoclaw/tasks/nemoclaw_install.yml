---
- name: Clone NemoClaw repository (shallow)
  git:
    repo: "https://github.com/NVIDIA/NemoClaw.git"
    dest: /opt/nemoclaw-src
    version: "{{ nemoclaw_install_ref }}"
    depth: 1

- name: Install NemoClaw production dependencies
  command: npm install --omit=dev --loglevel=warn
  args:
    chdir: /opt/nemoclaw-src
    creates: /opt/nemoclaw-src/node_modules/.package-lock.json

- name: Link nemoclaw binary globally
  file:
    src: /opt/nemoclaw-src/bin/nemoclaw
    dest: /usr/local/bin/nemoclaw
    state: link

- name: Verify nemoclaw installation
  shell:
    cmd: nemoclaw --version
    executable: /bin/bash
  become: true
  become_user: "{{ nemoclaw_user }}"
  environment:
    HOME: "{{ nemoclaw_home }}"
  register: nemoclaw_version
  changed_when: false

- name: Display installed nemoclaw version
  debug:
    msg: "NemoClaw installed: {{ nemoclaw_version.stdout }}"

- name: Create first-login NemoClaw onboarding script
  template:
    src: nemoclaw-setup.sh.j2
    dest: /etc/profile.d/nemoclaw-setup.sh
    owner: root
    group: root
    mode: '0755'
