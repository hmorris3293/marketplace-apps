---
- name: Create nemoclaw system user
  user:
    name: "{{ nemoclaw_user }}"
    comment: "Nemoclaw Service User"
    system: true
    shell: /bin/bash
    create_home: true
    home: "{{ nemoclaw_home }}"
    state: present

- name: Add nemoclaw user to sudoers with scoped NOPASSWD
  copy:
    dest: "/etc/sudoers.d/{{ nemoclaw_user }}"
    mode: '0440'
    owner: root
    group: root
    content: |
      # Nemoclaw sudo permissions (scoped for security)
      #
      # SECURITY NOTE: These permissions are intentionally limited.
      # If nemoclaw is compromised, attackers can only:
      # - Manage the nemoclaw service
      # - Run basic tailscale diagnostics
      # - View nemoclaw logs
      #
      # To grant full tailscale control (e.g., for self-healing VPN):
      #   {{ nemoclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/tailscale *
      #
      # To grant full sudo (NOT RECOMMENDED):
      #   {{ nemoclaw_user }} ALL=(ALL) NOPASSWD: ALL

      # Service control - nemoclaw service only
      {{ nemoclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/systemctl start nemoclaw
      {{ nemoclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/systemctl stop nemoclaw
      {{ nemoclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart nemoclaw
      {{ nemoclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/systemctl status nemoclaw
      {{ nemoclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/systemctl enable nemoclaw
      {{ nemoclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/systemctl disable nemoclaw
      # daemon-reload affects all units (required after service file changes)
      {{ nemoclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/systemctl daemon-reload

      # Tailscale - diagnostics + connect/disconnect
      # NOTE: 'up' allows flags like --advertise-exit-node. For tighter control,
      # remove 'up' and 'down' lines - operator must then manage VPN manually.
      {{ nemoclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/tailscale status
      {{ nemoclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/tailscale up *
      {{ nemoclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/tailscale down
      {{ nemoclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/tailscale ip *
      {{ nemoclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/tailscale version
      {{ nemoclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/tailscale ping *
      {{ nemoclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/tailscale whois *

      # Journal access - nemoclaw logs only
      {{ nemoclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/journalctl -u nemoclaw *
    validate: /usr/sbin/visudo -cf %s

# Fix DBus issues for systemd user services
- name: Get nemoclaw user ID
  command: "id -u {{ nemoclaw_user }}"
  register: nemoclaw_uid
  changed_when: false

- name: Display nemoclaw user ID
  debug:
    msg: "Nemoclaw user ID: {{ nemoclaw_uid.stdout }}"

- name: Enable lingering for nemoclaw user (allows systemd user services without login)
  command: "loginctl enable-linger {{ nemoclaw_user }}"
  changed_when: false

- name: Create runtime directory for nemoclaw user
  file:
    path: "/run/user/{{ nemoclaw_uid.stdout }}"
    state: directory
    owner: "{{ nemoclaw_user }}"
    group: "{{ nemoclaw_user }}"
    mode: '0700'

- name: Set XDG_RUNTIME_DIR in .bashrc for nemoclaw user
  lineinfile:
    path: "{{ nemoclaw_home }}/.bashrc"
    line: 'export XDG_RUNTIME_DIR=/run/user/$(id -u)'
    state: present
    create: true
    insertafter: EOF
    owner: "{{ nemoclaw_user }}"
    group: "{{ nemoclaw_user }}"
    mode: '0644'

- name: Set DBUS_SESSION_BUS_ADDRESS in .bashrc for nemoclaw user
  blockinfile:
    path: "{{ nemoclaw_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - DBus config"
    block: |
      # DBus session bus configuration
      if [ -z "$DBUS_SESSION_BUS_ADDRESS" ]; then
        export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
      fi
    create: true
    insertafter: EOF
    owner: "{{ nemoclaw_user }}"
    group: "{{ nemoclaw_user }}"
    mode: '0644'
