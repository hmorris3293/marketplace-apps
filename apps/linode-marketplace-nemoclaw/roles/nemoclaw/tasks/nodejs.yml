---
- name: Install required packages for Node.js
  apt:
    name:
      - ca-certificates
      - curl
      - git
      - gnupg
    state: present
    update_cache: true

- name: Create directory for NodeSource GPG key
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download NodeSource GPG key
  get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: '0644'

- name: Add NodeSource repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_22.x nodistro main"
    filename: nodesource
    state: present
    update_cache: true

- name: Update apt and install Node.js
  apt:
    name: nodejs
    state: present
    update_cache: true

- name: Verify Node.js installation
  command: node --version
  register: node_version
  changed_when: false

- name: Display Node.js version
  debug:
    msg:
      - "Node.js version: {{ node_version.stdout }}"
