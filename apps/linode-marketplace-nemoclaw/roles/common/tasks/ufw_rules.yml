---
- name: Configure SSH UFW rule
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Configure HTTPs UFW rule
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]

- name: Allow Docker bridge access to NemoClaw service port
  community.general.ufw:
    rule: allow
    from_ip: 172.18.0.0/16
    to_ip: 172.18.0.1
    to_port: "8080"
    proto: tcp

- name: Allow Docker bridge access to NemoClaw secondary service port
  community.general.ufw:
    rule: allow
    from_ip: 172.18.0.0/16
    to_ip: 172.18.0.1
    to_port: "11435"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
