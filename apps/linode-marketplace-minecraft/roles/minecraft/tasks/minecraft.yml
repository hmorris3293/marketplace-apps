---
- name: Install mcserver script
  shell:
    chdir: /home/linuxgsm
    cmd: ./linuxgsm.sh mcserver
  become: true
  become_user: linuxgsm

- name: Install Minecraft server files
  shell:
    chdir: /home/linuxgsm
    cmd: ./mcserver auto-install
  args:
    creates: /home/linuxgsm/serverfiles/eula.txt
  become: true
  become_user: linuxgsm

- name: Accept Minecraft EULA
  lineinfile:
    path: /home/linuxgsm/serverfiles/eula.txt
    regexp: '^eula='
    line: 'eula=true'
    create: true
    owner: linuxgsm
    group: linuxgsm
    mode: '0644'

- name: Update RCON password in server.properties
  lineinfile:
    path: /home/linuxgsm/serverfiles/server.properties
    regexp: '^rcon\.password='
    line: 'rcon.password="{{ rconpassword }}"'
  become: true
  become_user: linuxgsm

- name: Create Minecraft systemd service
  copy:
    dest: /etc/systemd/system/mcserver.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Minecraft Server (LinuxGSM)
      After=network.target

      [Service]
      Type=forking
      User=linuxgsm
      Group=linuxgsm
      WorkingDirectory=/home/linuxgsm
      ExecStart=/home/linuxgsm/mcserver start
      ExecStop=/home/linuxgsm/mcserver stop
      ExecReload=/home/linuxgsm/mcserver restart
      Restart=on-failure
      RestartSec=15

      [Install]
      WantedBy=multi-user.target

- name: Enable and start Minecraft service
  systemd:
    name: mcserver
    enabled: true
    state: started
    daemon_reload: true
