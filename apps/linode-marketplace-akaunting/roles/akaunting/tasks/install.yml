---
# D1: track latest — resolve the release via the GitHub API. The vendor's own
# download.php?version=latest lags GitHub, and the asset filename embeds the version
# (Akaunting_<ver>-Stable.zip), so a static releases/latest/download URL 404s.
- name: Resolve the latest Akaunting release from the GitHub API
  uri:
    url: https://api.github.com/repos/akaunting/akaunting/releases/latest
    return_content: true
  register: akaunting_release

- name: Set Akaunting download facts
  set_fact:
    akaunting_version: "{{ akaunting_release.json.tag_name }}"
    akaunting_download_url: "{{ akaunting_release.json.assets | selectattr('name', 'search', '-Stable.zip$') | map(attribute='browser_download_url') | first }}"

- name: Download the Akaunting release archive
  get_url:
    url: "{{ akaunting_download_url }}"
    dest: /tmp/akaunting.zip
    mode: '0644'

- name: Create the web root directory
  file:
    path: "{{ akaunting_web_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Extract Akaunting into the web root
  unarchive:
    src: /tmp/akaunting.zip
    dest: "{{ akaunting_web_root }}"
    remote_src: true
    owner: www-data
    group: www-data
    creates: "{{ akaunting_web_root }}/artisan"

- name: Remove the default nginx index page from the web root
  file:
    path: "{{ akaunting_web_root }}/index.nginx-debian.html"
    state: absent

# D12: www-data ownership, 755 dirs / 644 files (u=rwX keeps storage/ and
# bootstrap/cache/ owner-writable for the Laravel runtime)
- name: Set ownership and baseline permissions on the web root
  file:
    path: "{{ akaunting_web_root }}"
    state: directory
    owner: www-data
    group: www-data
    recurse: true
    mode: 'u=rwX,g=rX,o=rX'

# the sweep above would leave a pre-existing .env (live DB creds) world-readable on re-runs
- name: Check for an existing environment file
  stat:
    path: "{{ akaunting_web_root }}/.env"
  register: akaunting_env_stat

- name: Restore .env permissions after the permissions sweep
  file:
    path: "{{ akaunting_web_root }}/.env"
    owner: www-data
    group: www-data
    mode: '0640'
  when: akaunting_env_stat.stat.exists

# D8: the CLI installer never sets APP_URL (Installer::finalTouches only sets it for web
# installs), so it must be pre-baked; DB credentials are written to .env by the installer
# itself and need no pre-bake. APP_KEY is generated by the installer (key:generate redundant).
- name: Pre-bake the Akaunting environment file
  copy:
    src: "{{ akaunting_web_root }}/.env.example"
    dest: "{{ akaunting_web_root }}/.env"
    remote_src: true
    force: false
    owner: www-data
    group: www-data
    mode: '0640'

- name: Set APP_URL to the deployment hostname
  lineinfile:
    path: "{{ akaunting_web_root }}/.env"
    regexp: '^APP_URL='
    line: "APP_URL=https://{{ _domain }}"

- name: Disable debug mode
  lineinfile:
    path: "{{ akaunting_web_root }}/.env"
    regexp: '^APP_DEBUG='
    line: APP_DEBUG=false

- name: Check whether Akaunting is already installed
  slurp:
    src: "{{ akaunting_web_root }}/.env"
  register: akaunting_env_probe

# D5: non-interactive CLI installer creates the schema, company and admin user and flips
# APP_INSTALLED=true — the browser installer is never presented (§7a).
- name: Run the Akaunting CLI installer
  command: >-
    php artisan install --no-interaction
    --db-host=localhost --db-port=3306
    --db-name={{ database_name }}
    --db-username={{ database_user }}
    --db-password={{ db_user_password }}
    --company-name="{{ company_name }}"
    --company-email="{{ soa_email_address }}"
    --admin-email="{{ soa_email_address }}"
    --admin-password={{ admin_user_password }}
    --locale=en-US
  args:
    chdir: "{{ akaunting_web_root }}"
  become: true
  become_user: www-data
  when: "'APP_INSTALLED=true' not in (akaunting_env_probe.content | b64decode)"
  no_log: true

# re-enforced after the installer (and after the baseline permissions sweep on re-runs) —
# .env holds live DB credentials and must never be world-readable
- name: Enforce .env ownership and permissions
  file:
    path: "{{ akaunting_web_root }}/.env"
    owner: www-data
    group: www-data
    mode: '0640'

# D14: eliminate the in-app onboarding wizard (/1/wizard) — it only re-collects data the CLI
# installer already seeded. The settings row is installer-seeded to 0 (UPDATE, not INSERT);
# the table prefix is random per deploy, so resolve it from the installed .env.
- name: Read the installed environment file for the DB prefix
  slurp:
    src: "{{ akaunting_web_root }}/.env"
  register: akaunting_env_installed

- name: Set the DB table prefix fact
  set_fact:
    akaunting_db_prefix: "{{ akaunting_env_installed.content | b64decode | regex_search('DB_PREFIX=(\\w+)', '\\1') | first }}"

- name: Mark the onboarding wizard as completed
  community.mysql.mysql_query:
    login_db: "{{ database_name }}"
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock
    query: "UPDATE {{ akaunting_db_prefix }}settings SET value = 1 WHERE company_id = 1 AND `key` = 'wizard.completed'"

# MODEL_CACHE_ENABLED=true after install makes this flush load-bearing (D14)
- name: Clear the Akaunting application cache
  command: php artisan cache:clear
  args:
    chdir: "{{ akaunting_web_root }}"
  become: true
  become_user: www-data
  environment:
    HOME: /tmp
