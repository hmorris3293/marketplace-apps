---
# Install Addons if requested
- name: Add addons
  import_role:
    name: addons
  when: add_ons != ['none']

- name: Set up MOTD
  template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: '0644'

- name: Writing creds into file
  copy:
    dest: '/home/{{ username }}/.credentials'
    mode: '0600'
    owner: '{{ username }}'
    group: '{{ username }}'
    content: |
      Sudo Username: {{ username }}
      Sudo Password: {{ password }}

      # OnlyOffice Docs
      OnlyOffice Docs runs in a Docker container bound to 127.0.0.1:8080 on
      this instance and is not exposed publicly. Access it through an SSH
      tunnel from your local machine:
      Tunnel command (run locally): ssh -L 8080:127.0.0.1:8080 {{ username }}@{{ _domain }}
      Local URL: http://127.0.0.1:8080/example
