---
- name: Create htpasswd file on host
  community.general.htpasswd:
    path: /etc/nginx/.htpasswd_wizard
    name: onlyoffice
    password: "{{ wizard_password }}"
    mode: '0640'

- name: Copy htpasswd file into onlyoffice-proxy container
  ansible.builtin.command: docker cp /etc/nginx/.htpasswd_wizard onlyoffice-proxy:/etc/nginx/.htpasswd_wizard
  changed_when: true

- name: Enable HTTP Basic Auth inside onlyoffice-proxy Nginx config
  ansible.builtin.shell: |
    docker exec onlyoffice-proxy sh -c "sed '/location \/ {/a \    auth_basic \"Restricted Setup Wizard\";\n    auth_basic_user_file /etc/nginx/.htpasswd_wizard;' /etc/nginx/conf.d/default.conf > /tmp/default.conf && cat /tmp/default.conf > /etc/nginx/conf.d/default.conf && rm -f /tmp/default.conf"
  changed_when: true

- name: Reload Nginx proxy container to enforce basic auth
  ansible.builtin.command: docker exec onlyoffice-proxy nginx -s reload
  changed_when: true
