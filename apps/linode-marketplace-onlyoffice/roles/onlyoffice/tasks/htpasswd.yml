---
- name: Create htpasswd file on host
  community.general.htpasswd:
    path: /etc/nginx/.htpasswd_wizard
    name: onlyoffice
    password: "{{ wizard_password }}"
    mode: '0644'

- name: Copy htpasswd file into onlyoffice-proxy container
  ansible.builtin.command: docker cp /etc/nginx/.htpasswd_wizard onlyoffice-proxy:/etc/nginx/.htpasswd_wizard
  changed_when: true

- name: Ensure htpasswd file permissions inside container
  ansible.builtin.command: docker exec onlyoffice-proxy chmod 644 /etc/nginx/.htpasswd_wizard
  changed_when: true

- name: Enable Basic Auth and strip Authorization header in Nginx config
  ansible.builtin.shell: |
    docker exec onlyoffice-proxy sh -c "
      grep -v 'auth_basic' /etc/nginx/conf.d/default.conf | grep -v 'proxy_set_header Authorization' > /tmp/clean.conf
      sed '/location \/ {/a \    auth_basic \"Restricted Setup Wizard\";\n    auth_basic_user_file /etc/nginx/.htpasswd_wizard;\n    proxy_set_header Authorization \"\";' /tmp/clean.conf > /tmp/final.conf
      cat /tmp/final.conf > /etc/nginx/conf.d/default.conf
      rm -f /tmp/clean.conf /tmp/final.conf
    "
  changed_when: true

- name: Reload Nginx proxy container
  ansible.builtin.command: docker exec onlyoffice-proxy nginx -s reload
  changed_when: true
