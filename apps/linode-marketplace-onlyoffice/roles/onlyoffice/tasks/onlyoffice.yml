---
- name: Install prerequisite APT packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - wget
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Create ONLYOFFICE working directory
  file:
    path: /app/onlyoffice
    state: directory
    mode: '0755'

- name: Create persistent directories for DocumentServer
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /app/onlyoffice/DocumentServer/data
    - /app/onlyoffice/DocumentServer/logs

- name: Deploy ONLYOFFICE Docs Docker container
  community.docker.docker_container:
    name: onlyoffice-docs
    image: onlyoffice/documentserver:latest
    state: started
    restart_policy: always
    published_ports:
      - "127.0.0.1:{{ onlyoffice_port }}:80"
    env:
      JWT_ENABLED: "true"
      JWT_SECRET: "{{ jwt_secret }}"
    volumes:
      - /app/onlyoffice/DocumentServer/data:/var/www/onlyoffice/Data
      - /app/onlyoffice/DocumentServer/logs:/var/log/onlyoffice
