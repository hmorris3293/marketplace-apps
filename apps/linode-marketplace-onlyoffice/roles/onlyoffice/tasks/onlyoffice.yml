---
- name: Install prerequisite APT packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - wget
    state: present
    update_cache: true

- name: Generate SSL
  import_role:
    name: certbot_ssl
  vars:
    webserver_stack: standalone

- name: Create ONLYOFFICE certs directory structure
  file:
    path: "{{ cert_dir }}"
    state: directory
    mode: '0755'

- name: Copy SSL certificates to ONLYOFFICE auto-discovery volume
  copy:
    src: "/etc/letsencrypt/live/{{ _domain }}/{{ item.src }}"
    dest: "{{ cert_dir }}/{{ item.dest }}"
    remote_src: true
    mode: '0600'
  loop:
    - { src: 'fullchain.pem', dest: 'onlyoffice.crt' }
    - { src: 'privkey.pem', dest: 'onlyoffice.key' }

- name: Deploy Certbot renewal hook from Jinja2 template
  template:
    src: reload-onlyoffice.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-onlyoffice.sh
    mode: '0755'

- name: Download ONLYOFFICE Docker installer script
  get_url:
    url: https://download.onlyoffice.com/install/install.sh
    dest: /tmp/install.sh
    mode: '0755'

- name: Execute ONLYOFFICE Workspace installer non-interactively
  command: >
    bash /tmp/install.sh
    --installationtype WORKSPACE
    --maildomain "{{ _domain }}"
    --installmailserver false
    --skiphardwarecheck true
  args:
    creates: /app/onlyoffice/setup/config

- name: GET ONLYOFFICE wizard page to retrieve session cookie and HTML
  ansible.builtin.uri:
    url: "https://{{ _domain }}/wizard.aspx"
    method: GET
    validate_certs: false
    return_content: true
  register: wizard_get
  until:
    - wizard_get.status == 200
    - "'ASC.Resources' in wizard_get.content or 'wizard' in wizard_get.content"
  retries: 30
  delay: 10

- name: Extract ASP.NET state tokens from GET response
  set_fact:
    asp_viewstate: "{{ wizard_get.content | regex_findall('name=\"__VIEWSTATE\"[^>]*value=\"([^\"]*)\"') | first | default('') }}"
    asp_viewstategenerator: "{{ wizard_get.content | regex_findall('name=\"__VIEWSTATEGENERATOR\"[^>]*value=\"([^\"]*)\"') | first | default('') }}"
    asp_eventvalidation: "{{ wizard_get.content | regex_findall('name=\"__EVENTVALIDATION\"[^>]*value=\"([^\"]*)\"') | first | default('') }}"

- name: Submit setup form with session cookie and ASP.NET tokens
  uri:
    url: "https://{{ _domain }}/wizard.aspx"
    method: POST
    validate_certs: false
    body_format: form-urlencoded
    headers:
      Cookie: "{{ wizard_get.cookies_string }}"
      Host: "{{ _domain }}"
      Referer: "https://{{ _domain }}/wizard.aspx"
    body:
      __VIEWSTATE: "{{ asp_viewstate }}"
      __VIEWSTATEGENERATOR: "{{ asp_viewstategenerator }}"
      __EVENTVALIDATION: "{{ asp_eventvalidation }}"
      pwd: "{{ admin_password }}"
      pwdConfirm: "{{ admin_password }}"
      email: "{{ soa_email_address }}"
      timeZone: "UTC"
      lng: "en-US"
      cbxLicense: "on"
    status_code: [200, 302]
  register: wizard_post

