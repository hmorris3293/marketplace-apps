---
- name: Install prerequisite APT packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - wget
    state: present
    update_cache: true

- name: Generate SSL
  import_role:
    name: certbot_ssl
  vars:
    webserver_stack: standalone

- name: Create ONLYOFFICE certs directory structure
  file:
    path: "{{ cert_dir }}"
    state: directory
    mode: '0755'

- name: Copy SSL certificates to ONLYOFFICE auto-discovery volume
  copy:
    src: "/etc/letsencrypt/live/{{ _domain }}/{{ item.src }}"
    dest: "{{ cert_dir }}/{{ item.dest }}"
    remote_src: true
    mode: '0600'
  loop:
    - { src: 'fullchain.pem', dest: 'onlyoffice.crt' }
    - { src: 'privkey.pem', dest: 'onlyoffice.key' }

- name: Deploy Certbot renewal hook from Jinja2 template
  template:
    src: reload-onlyoffice.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-onlyoffice.sh
    mode: '0755'

- name: Download ONLYOFFICE Docker installer script
  get_url:
    url: https://download.onlyoffice.com/install/install.sh
    dest: /tmp/install.sh
    mode: '0755'

- name: Execute ONLYOFFICE Workspace installer non-interactively
  command: >
    bash /tmp/install.sh
    --installationtype WORKSPACE
    --maildomain "{{ _domain }}"
    --installmailserver false
    --skiphardwarecheck true
  args:
    creates: /app/onlyoffice/setup/config

