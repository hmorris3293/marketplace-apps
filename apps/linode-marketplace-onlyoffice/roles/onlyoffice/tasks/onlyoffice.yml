---
- name: Install prerequisite APT packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - wget
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Create ONLYOFFICE working directory
  file:
    path: /app/onlyoffice
    state: directory
    mode: '0755'

- name: Download ONLYOFFICE DocSpace installer
  get_url:
    url: https://download.onlyoffice.com/docspace/docspace-install.sh
    dest: /app/onlyoffice/docspace-install.sh
    mode: '0755'

- name: Install ONLYOFFICE DocSpace Community Edition with Docker, JWT and Let's Encrypt SSL
  shell:
    cmd: >-
      bash /app/onlyoffice/docspace-install.sh docker
      --installationtype community
      --noninteractive true
      --makeswap true
      --jwtsecret {{ jwt_secret }}
      --letsencryptdomain {{ _domain }}
      --letsencryptmail {{ soa_email_address }}
      && touch /app/onlyoffice/.docspace-installed
    creates: /app/onlyoffice/.docspace-installed
  changed_when: true
