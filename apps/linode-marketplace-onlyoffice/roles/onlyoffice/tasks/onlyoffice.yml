---
- name: Install prerequisite APT packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - wget
    state: present
    update_cache: true

- name: Download ONLYOFFICE DocSpace installer script
  get_url:
    url: https://download.onlyoffice.com/docspace/docspace-install.sh
    dest: /tmp/docspace-install.sh
    mode: '0755'

- name: Execute ONLYOFFICE DocSpace Community Docker deployment
  shell: >
    bash /tmp/docspace-install.sh docker
    -it community
    -skiphc false
    -js "{{ jwt_secret }}"
    -mk "{{ machine_key }}"
    -mysqlrp "{{ mysql_root_password }}"
    -mysqld  onlyofficedb
    -mysqlu onlyoffice
    -mysqlp "{{ mysql_docspace_password }}"
    -led "{{ _domain }}"
    -lem "{{ soa_email_address }}"
  args:
    creates: /app/onlyoffice

- name: Remove temporary installer script
  file:
    path: /tmp/docspace-install.sh
    state: absent