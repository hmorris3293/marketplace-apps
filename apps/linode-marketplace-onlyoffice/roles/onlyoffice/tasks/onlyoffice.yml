---
- name: Install prerequisite APT packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - software-properties-common
      - wget
      - curl
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Create host persistent data directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /app/onlyoffice
    - /app/onlyoffice/DocumentServer/logs
    - /app/onlyoffice/DocumentServer/data
    - /app/onlyoffice/DocumentServer/lib
    - /app/onlyoffice/DocumentServer/rabbitmq
    - /app/onlyoffice/DocumentServer/redis
    - /app/onlyoffice/DocumentServer/db
    - /app/onlyoffice/DocumentServer/example-files

- name: Deploy ONLYOFFICE docker compose file
  template:
    src: docker-compose.yml.j2
    dest: /app/onlyoffice/docker-compose.yml
    mode: '0644'

- name: Deploy ONLYOFFICE DocumentServer via docker compose
  community.docker.docker_compose_v2:
    project_src: /app/onlyoffice
    state: present
    pull: always
    wait: true
    wait_timeout: 300
