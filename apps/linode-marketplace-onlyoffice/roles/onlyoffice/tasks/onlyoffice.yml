---
- name: Install prerequisite APT packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - wget
    state: present
    update_cache: true

- name: Generate SSL
  import_role:
    name: certbot_ssl
  vars:
    webserver_stack: standalone

- name: Create ONLYOFFICE certs directory structure
  file:
    path: "{{ cert_dir }}"
    state: directory
    mode: '0755'

- name: Copy SSL certificates to ONLYOFFICE auto-discovery volume
  copy:
    src: "/etc/letsencrypt/live/{{ _domain }}/{{ item.src }}"
    dest: "{{ cert_dir }}/{{ item.dest }}"
    remote_src: true
    mode: '0600'
  loop:
    - { src: 'fullchain.pem', dest: 'onlyoffice.crt' }
    - { src: 'privkey.pem', dest: 'onlyoffice.key' }

- name: Deploy Certbot renewal hook from Jinja2 template
  template:
    src: reload-onlyoffice.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-onlyoffice.sh
    mode: '0755'

- name: Download ONLYOFFICE Docker installer script
  get_url:
    url: https://download.onlyoffice.com/install/install.sh
    dest: /tmp/install.sh
    mode: '0755'

- name: Execute ONLYOFFICE Workspace installer non-interactively
  command: >
    bash /tmp/install.sh
    --installationtype WORKSPACE
    --maildomain "{{ _domain }}"
    --installmailserver false
    --skiphardwarecheck true
  args:
    creates: /app/onlyoffice/setup/config

- name: GET wizard page to initialize web session
  ansible.builtin.uri:
    url: "https://{{ _domain }}/Wizard.aspx"
    method: GET
    validate_certs: false
  register: wizard_get
  until: wizard_get.status == 200
  retries: 30
  delay: 10

- name: Complete ONLYOFFICE setup via AjaxPro SaveData handler
  ansible.builtin.uri:
    url: "https://{{ _domain }}/ajaxpro/ASP.usercontrols_firsttime_emailandpassword_ascx,ASC.ashx"
    method: POST
    validate_certs: false
    headers:
      Host: "{{ _domain }}"
      Origin: "https://{{ _domain }}"
      Referer: "https://{{ _domain }}/Wizard.aspx"
      Content-Type: "text/plain; charset=UTF-8"
      X-AjaxPro-Method: "SaveData"
      Cookie: "{{ wizard_get.cookies_string | default('') }}"
    body_format: raw
    body: >-
      {"email":"{{ soa_email_address }}","passwordHash":"{{ admin_password | hash('sha256') }}","lng":"en-US","promocode":null,"amiid":null,"subscribeFromSite":false}
    status_code: 200
  register: setup_response

- name: Verify wizard is completed and owner account created
  ansible.builtin.uri:
    url: "https://{{ _domain }}/"
    status_code: [200, 302]
    validate_certs: false
    follow_redirects: safe
  register: portal_check
  failed_when: "'Wizard.aspx' in portal_check.url or 'wizard.aspx' in portal_check.url"

