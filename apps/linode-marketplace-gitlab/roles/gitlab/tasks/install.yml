---
# install system packages

- name: install required packages
  apt:
    pkg:
      - curl
      - htop
      - ca-certificates
      - tzdata
      - perl
      - gnupg
      - apt-transport-https
    state: latest
    update_cache: true

- name: add gitLab package repository install
  shell: curl -fsSL https://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.deb.sh | bash
  args:
    executable: /bin/bash

- name: install gitlab
  apt:
    name: gitlab-ce
    state: latest
    update_cache: yes

- name: configure gitlab
  template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb

- name: reconfigure gitlab
  shell: gitlab-ctl reconfigure
  async: 480
  poll: 0

- name: obtain defaut password
  slurp:
    src: /etc/gitlab/initial_root_password
  register: gitlab_password
  no_log: true

- name: Extract the password using regex
  set_fact:
    gitlab_root_password: "{{ gitlab_password_file['content'] | b64decode | regex_findall('Password: (.+)') | first }}"
  no_log: true