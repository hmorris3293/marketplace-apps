---
# install system packages

- name: install required packages
  apt:
    pkg:
      - curl
      - htop
      - ca-certificates
      - tzdata
      - perl
    state: latest
    update_cache: true

- name: add gitLab package repository install
  shell: curl -fsSL https://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.deb.sh | bash

- name: install gitlab
  apt:
    name: gitlab-ce
    state: latest
    update_cache: yes
