---
# install system packages
- name: install required dependencies
  apt:
    name:
      - curl
      - sudo
      - git
    state: present

- name: download pi-hole installation script
  get_url:
    url: https://install.pi-hole.net
    dest: /tmp/install-pihole.sh
    mode: '0755'

- name: run Pi-hole installer
  shell: /tmp/install-pihole.sh --unattended

- name: update config to listen on 8080/8443
  replace:
    path: /etc/pihole/pihole.toml
    regexp: 'port = "80o,443os,\[::\]:80o,\[::\]:443os"'
    replace: 'port = "8080o,[::]:8080o"'

- name: reconfig pihole
  command: pihole -r

