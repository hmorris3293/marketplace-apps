---
# install system packages
- name: install required dependencies
  apt:
    name:
      - curl
      - sudo
      - git
    state: present

- name: install pihole
  shell: curl -L https://install.pi-hole.net | bash /dev/stdin --unattended
  async: 500
  poll: 20

#- name: download pi-hole installation script
#  get_url:
