- name: update config to listen on 8080/8443
  replace:
    path: /etc/pihole/pihole.toml
    regexp: 'port = "80o,443os,\[::\]:80o,\[::\]:443os"'
    replace: 'port = "8080o,[::]:8080o"'

- name: reconfig pihole
  command: pihole -r

