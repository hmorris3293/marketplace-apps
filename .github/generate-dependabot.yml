name: Update Dependabot Config 

on:
  schedule:
    - cron: '0 5 * * *'   # Every day at 05:00 UTC
  push:
    paths:
      - 'apps/**/requirements.txt'

jobs:
  update-dependabot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dependabot.yml
        run: |
          echo "version: 2" > .github/dependabot.yml
          echo "updates:" >> .github/dependabot.yml
          find apps/ -type f -name requirements.txt | while read req; do
            dir=$(dirname "$req" | sed 's/^/  - package-ecosystem: "pip"\n    directory: "\//' | sed 's/$/"/')
            cat <<EOF >> .github/dependabot.yml
    schedule:
      interval: "daily"
    target-branch: "dependabot"
EOF
          done
          
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/dependabot.yml
          git diff --cached --quiet || git commit -m "Update dependabot.yml automatically"
          git push
