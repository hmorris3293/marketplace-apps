name: Update Dependabot Config

on:
  schedule:
    - cron: '0 5 * * *'
  push:
    paths:
      - 'apps/**/requirements.txt'
  workflow_dispatch:

jobs:
  update-dependabot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dependabot.yml
        run: |
          mkdir -p .github
          echo 'version: 2' > .github/dependabot.yml
          echo 'updates:' >> .github/dependabot.yml
          find apps/ -type f -name requirements.txt | while read req; do
            dir=$(dirname "$req")
            echo "  - package-ecosystem: \"pip\"" >> .github/dependabot.yml
            echo "    directory: \"/$dir\"" >> .github/dependabot.yml
            echo "    schedule:" >> .github/dependabot.yml
            echo "      interval: \"daily\"" >> .github/dependabot.yml
            echo "    target-branch: \"develop\"" >> .github/dependabot.yml
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/dependabot.yml
          git diff --cached --quiet || git commit -m "Update dependabot.yml automatically"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
