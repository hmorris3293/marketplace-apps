name: Update Dependabot Config

on:
  workflow_dispatch:    # Manual trigger from GitHub UI
  push:
    paths:
      - 'apps/**/requirements.txt'
  schedule:
    - cron: '0 5 * * *'   # Optional: daily at 05:00 UTC

jobs:
  update-dependabot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dependabot.yml
        run: |
          mkdir -p .github
          echo "version: 2" > .github/dependabot.yml
          echo "updates:" >> .github/dependabot.yml
          find apps/ -type f -name requirements.txt | while read req; do
            dir=$(dirname "$req")
            cat <<EOF >> .github/dependabot.yml
  - package-ecosystem: "pip"
    directory: "/$dir"
    schedule:
      interval: "daily"
    target-branch: "develop"
EOF
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/dependabot.yml
          git diff --cached --quiet || git commit -m "Update dependabot.yml automatically"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
